<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇 · 乔昶旭 JOCK</title>
  <meta name="description" content="贪吃蛇小游戏 · JOCK 乔昶旭">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="page__header container">
    <nav aria-label="页面导航">
      <a class="page__back" href="about.html">← 返回关于我</a>
    </nav>
    <div class="page__heading">
      <h1 class="page__title">贪吃蛇</h1>
    </div>
  </header>

  <main id="main" class="page container">
    <div class="snake">
      <p class="snake__score">分数 <strong id="score">0</strong> · 最高 <strong id="best">0</strong></p>
      <div class="snake__board">
        <canvas id="snake-canvas" width="400" height="400" role="img" aria-label="贪吃蛇游戏棋盘"></canvas>
      </div>
      <button id="snake-start" class="btn btn--primary" type="button">开始游戏</button>
      <p class="snake__hint">方向键 / WASD 控制方向 · 触屏用下方按钮</p>
      <div class="snake__pad">
        <button class="pad-btn" type="button" data-dir="up" aria-label="向上">↑</button>
        <button class="pad-btn" type="button" data-dir="left" aria-label="向左">←</button>
        <button class="pad-btn" type="button" data-dir="right" aria-label="向右">→</button>
        <button class="pad-btn" type="button" data-dir="down" aria-label="向下">↓</button>
      </div>
    </div>
  </main>

  <script src="assets/js/snake.js"></script>
</body>
</html>
